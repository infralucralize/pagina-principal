<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Meta de Clientes</title>
<script src="./libs/chart.umd.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
  }
  .wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 10px 14px;
    box-sizing: border-box;
  }
  .card {
    flex: 1 1 280px;
    min-width: 240px;
  }
  h3 { margin: 0 0 3px 0; font-size: 18px; }
  p.sub { margin: 0 0 8px 0; opacity: 0.7; font-size: 12px; }
  .chart-box {
    position: relative;
    height: 180px;
  }
  .chart-box canvas {
    width: 100% !important;
    height: 100% !important;
  }
  .bar-legend {
    display: flex;
    gap: 18px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .bar-legend .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .dot-a { background: #7dd3e8; }
  .dot-b { background: #ff4d5e; }
  .progress-bar {
    display: flex;
    height: 34px;
    border-radius: 17px;
    overflow: hidden;
    background: #2a2f45;
  }
  .segment {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0d1117;
    font-weight: 800;
    font-size: 14px;
    transition: width 0.4s ease;
    white-space: nowrap;
  }
  .segment-a { background: #7dd3e8; }
  .segment-b { background: #ff4d5e; }
  .center-value {
    position: absolute;
    top: 62%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    pointer-events: none;
  }
  .gauge-labels {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    opacity: 0.8;
    margin-top: 2px;
    padding: 0 8px;
  }
  .error { color: #ff6b6b; font-size: 13px; padding: 0 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h3>Meta de Clientes 2026</h3>
      <p class="sub" id="periodo">carregando…</p>
      <div class="chart-box">
        <canvas id="gauge"></canvas>
        <div class="center-value" id="gaugeValue"></div>
      </div>
      <div class="gauge-labels">
        <span>0</span>
        <span id="metaLabel"></span>
      </div>
    </div>
    <div class="card">
      <h3>Distribuição de Clientes</h3>
      <p class="sub" id="periodoDistribuicao">&nbsp;</p>
      <div class="bar-legend">
        <span><span class="dot dot-a"></span>Clientes Contabilidade (<span id="valA">–</span>)</span>
        <span><span class="dot dot-b"></span>Clientes Tech (<span id="valB">–</span>)</span>
      </div>
      <div class="progress-bar">
        <div id="segA" class="segment segment-a" style="width:50%"></div>
        <div id="segB" class="segment segment-b" style="width:50%"></div>
      </div>
    </div>
  </div>
  <div id="errorMsg" class="error"></div>

<script>
// Caminho relativo dentro do mesmo repositório/GitHub Pages — atualizado
// automaticamente pelo GitHub Actions (.github/workflows/atualizar-dados.yml)
const ENDPOINT = "./data/dados.json";

async function carregar() {
  try {
    const resp = await fetch(ENDPOINT, { cache: "no-store" });
    if (!resp.ok) throw new Error("Falha ao buscar dados (" + resp.status + ")");
    const d = await resp.json();
    renderGauge(d.total, d.meta);
    renderDistribuicao(d.totalClientesContabilidade, d.totalClientesTech);
    document.getElementById("periodo").textContent =
      "Atualizado em " + new Date(d.atualizadoEm).toLocaleString("pt-BR");
    document.getElementById("periodoDistribuicao").textContent =
      "Atualizado em " + new Date(d.atualizadoEm).toLocaleString("pt-BR");
  } catch (err) {
    document.getElementById("errorMsg").textContent =
      "Não foi possível carregar os dados agora. Tente novamente em instantes.";
    console.error(err);
  }
}

function renderGauge(valor, meta) {
  const ctx = document.getElementById("gauge");
  new Chart(ctx, {
    type: "doughnut",
    data: {
      datasets: [{
        data: [valor, Math.max(meta - valor, 0)],
        backgroundColor: ["#7dd3e8", "#2a2f45"],
        borderWidth: 0,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      circumference: 180,
      rotation: 270,
      cutout: "70%",
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
    },
  });
  document.getElementById("gaugeValue").textContent = valor;
  document.getElementById("metaLabel").textContent = meta;
}

function renderDistribuicao(clientesContabilidade, clientesTech) {
  const total = clientesContabilidade + clientesTech;
  const pctA = total > 0 ? (clientesContabilidade / total) * 100 : 50;
  const pctB = 100 - pctA;

  const segA = document.getElementById("segA");
  const segB = document.getElementById("segB");

  segA.style.width = pctA + "%";
  segB.style.width = pctB + "%";

  // só escreve o número dentro do segmento se ele tiver espaço mínimo pra caber
  segA.textContent = pctA > 12 ? clientesContabilidade : "";
  segB.textContent = pctB > 12 ? clientesTech : "";

  document.getElementById("valA").textContent = clientesContabilidade;
  document.getElementById("valB").textContent = clientesTech;
}

carregar();
setInterval(carregar, 5 * 60 * 1000); // atualiza a cada 5 min
</script>
</body>
</html>
