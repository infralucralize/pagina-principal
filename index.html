<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Meta de Clientes</title>
<script src="./libs/chart.umd.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
  }
  .wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 10px 14px;
    box-sizing: border-box;
  }
  .card {
    flex: 1 1 280px;
    min-width: 240px;
  }
  h3 { margin: 0 0 3px 0; font-size: 18px; }
  p.sub { margin: 0 0 8px 0; opacity: 0.7; font-size: 12px; }
  .chart-box {
    position: relative;
    height: 180px;
  }
  .chart-box canvas {
    width: 100% !important;
    height: 100% !important;
  }
  .chart-box-donut {
    height: 280px;
  }
  .center-value {
    position: absolute;
    top: 62%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    pointer-events: none;
  }
  .gauge-labels {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    opacity: 0.8;
    margin-top: 2px;
    padding: 0 8px;
  }
  .error { color: #ff6b6b; font-size: 13px; padding: 0 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h3>Meta de Clientes 2026</h3>
      <p class="sub" id="periodo">carregando…</p>
      <div class="chart-box">
        <canvas id="gauge"></canvas>
        <div class="center-value" id="gaugeValue"></div>
      </div>
      <div class="gauge-labels">
        <span>0</span>
        <span id="metaLabel"></span>
      </div>
    </div>
    <div class="card">
      <h3>Distribuição de Clientes</h3>
      <p class="sub">Clientes Contabilidade / Clientes Tech</p>
      <div class="chart-box chart-box-donut">
        <canvas id="donut"></canvas>
      </div>
    </div>
  </div>
  <div id="errorMsg" class="error"></div>

<script>
// Caminho relativo dentro do mesmo repositório/GitHub Pages — atualizado
// automaticamente pelo GitHub Actions (.github/workflows/atualizar-dados.yml)
const ENDPOINT = "./data/dados.json";

async function carregar() {
  try {
    const resp = await fetch(ENDPOINT, { cache: "no-store" });
    if (!resp.ok) throw new Error("Falha ao buscar dados (" + resp.status + ")");
    const d = await resp.json();
    renderGauge(d.total, d.meta);
    renderDonut(d.totalClientesContabilidade, d.totalClientesTech);
    document.getElementById("periodo").textContent =
      "Atualizado em " + new Date(d.atualizadoEm).toLocaleString("pt-BR");
  } catch (err) {
    document.getElementById("errorMsg").textContent =
      "Não foi possível carregar os dados agora. Tente novamente em instantes.";
    console.error(err);
  }
}

function renderGauge(valor, meta) {
  const ctx = document.getElementById("gauge");
  new Chart(ctx, {
    type: "doughnut",
    data: {
      datasets: [{
        data: [valor, Math.max(meta - valor, 0)],
        backgroundColor: ["#7dd3e8", "#2a2f45"],
        borderWidth: 0,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      circumference: 180,
      rotation: 270,
      cutout: "70%",
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
    },
  });
  document.getElementById("gaugeValue").textContent = valor;
  document.getElementById("metaLabel").textContent = meta;
}

function renderDonut(clientesContabilidade, clientesTech) {
  const ctx = document.getElementById("donut");
  new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: [
        `Clientes Contabilidade (${clientesContabilidade})`,
        `Clientes Tech (${clientesTech})`,
      ],
      datasets: [{
        data: [clientesContabilidade, clientesTech],
        backgroundColor: ["#7dd3e8", "#ff4d5e"],
        borderWidth: 0,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "60%",
      plugins: {
        legend: { position: "top", labels: { color: "#fff", boxWidth: 12, font: { size: 11 } } },
        tooltip: { enabled: true },
      },
    },
    plugins: [{
      id: "valoresNasFatias",
      afterDraw(chart) {
        const { ctx, data } = chart;
        ctx.save();
        ctx.font = "bold 13px -apple-system, Segoe UI, Roboto, sans-serif";
        ctx.fillStyle = "#0d1117";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        chart.getDatasetMeta(0).data.forEach((arc, i) => {
          const valor = data.datasets[0].data[i];
          if (!valor) return;
          const pos = arc.tooltipPosition();
          ctx.fillText(String(valor), pos.x, pos.y);
        });
        ctx.restore();
      },
    }],
  });
}

carregar();
setInterval(carregar, 5 * 60 * 1000); // atualiza a cada 5 min
</script>
</body>
</html>
